# 실행: docker compose up -d   /   종료: docker compose down
# PC에 PostgreSQL을 따로 설치한 경우 5432와 충돌하므로 기본 포트를 5433으로 둡니다.
# 5433도 쓰이고 있으면 프로젝트 루트의 .env 파일에 DB_PORT=5434 처럼 적으세요 (Spring도 같은 값을 읽습니다).
services:
  postgres:
    image: postgres:17
    container_name: dobong-postgres
    environment:
      POSTGRES_DB: dobong
      POSTGRES_USER: dobong
      POSTGRES_PASSWORD: dobong
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dobong -d dobong"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
