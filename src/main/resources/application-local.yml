# 로컬 개발용 설정. docker-compose.yml의 PostgreSQL에 연결합니다.
spring:
  config:
    # docker compose와 같은 .env 파일(DB_PORT 등)을 읽습니다. 파일이 없으면 무시합니다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/dobong
    username: dobong
    password: dobong
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
