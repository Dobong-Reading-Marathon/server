# 로컬 개발용 설정. docker-compose.yml의 PostgreSQL에 연결합니다.
spring:
  config:
    # docker compose와 같은 .env 파일(DB_PORT 등)을 읽습니다. 파일이 없으면 무시합니다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/dobong
    username: dobong
    password: dobong
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 로컬에서는 시연·테스트용 회차(db/seed)도 넣음. 운영(prod) 설정에는 절대 넣지 말 것
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    org.hibernate.SQL: debug

app:
  cors:
    # 로컬 프론트 개발 서버 (Vite 기본 포트). 다르면 .env에 CORS_ALLOWED_ORIGINS=http://localhost:3000 처럼 적으세요.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
