# 운영 프로파일 (SPRING_PROFILES_ACTIVE=prod). 접속 정보·비밀값은 application.yml처럼 환경변수로만 받습니다.
server:
  # Cloud Run이 PORT 환경변수로 포트를 줍니다. 없으면 8080
  port: ${PORT:8080}
  # Cloud Run 앞단 프록시가 붙인 X-Forwarded-For로 실제 접속 IP를 읽습니다.
  # 이게 없으면 모든 요청이 프록시 IP 하나로 보여서, 가입·로그인 횟수 제한이 전체 사용자 합계로 걸립니다.
  forward-headers-strategy: framework
  # 배포·재시작 때 처리 중인 요청을 마치고 내려갑니다.
  shutdown: graceful

spring:
  datasource:
    hikari:
      # 무료 DB의 동시 접속 수가 적어서 작게 둡니다. (Cloud Run 최대 인스턴스 1 기준)
      maximum-pool-size: 5
  # flyway.locations는 기본값(db/migration)만 씁니다. 시연 회차(db/seed)는 운영 DB에 넣지 않습니다.
